<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteJioSaavn API - Live Playground</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.2em;
            color: #fff;
            margin-bottom: 5px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1em;
        }
        
        .endpoints-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .endpoint-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .endpoint-card:hover {
            border-color: #6366f1;
            background: #243549;
            transform: translateY(-2px);
        }
        
        .endpoint-card.active {
            border-color: #6366f1;
            background: #243549;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }
        
        .card-title {
            font-size: 1em;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }
        
        .card-method {
            display: inline-block;
            padding: 3px 8px;
            background: #10b981;
            color: white;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .card-url {
            font-family: monospace;
            color: #cbd5e1;
            font-size: 0.8em;
            word-break: break-all;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            max-height: 800px;
            overflow-y: auto;
        }
        
        .panel h2 {
            font-size: 1.2em;
            margin-bottom: 15px;
            color: #6366f1;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.9em;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 0.85em;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        
        .btn-primary:hover {
            background: #4f46e5;
        }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .loading {
            text-align: center;
            padding: 30px;
            color: #94a3b8;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #334155;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: #7f1d1d;
            border: 1px solid #991b1b;
            color: #fca5a5;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        .json-viewer {
            background: #0f172a;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75em;
            overflow-x: auto;
            color: #4ade80;
            border: 1px solid #334155;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 700px;
            overflow-y: auto;
        }
        
        .results-grid {
            display: grid;
            gap: 12px;
        }
        
        .result-item {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px;
            transition: all 0.3s;
        }
        
        .result-item:hover {
            border-color: #6366f1;
        }
        
        .result-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .result-title {
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 6px;
            word-break: break-word;
            font-size: 0.9em;
        }
        
        .result-text {
            color: #cbd5e1;
            font-size: 0.85em;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        
        .result-meta {
            color: #64748b;
            font-size: 0.75em;
        }
        
        .url-display {
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            color: #4ade80;
            margin-top: 10px;
            word-break: break-all;
            border: 1px solid #334155;
            font-size: 0.8em;
        }
        
        .copy-btn {
            padding: 4px 8px;
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75em;
            margin-top: 8px;
        }
        
        .copy-btn:hover {
            background: #475569;
        }
        
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .json-key { color: #f472b6; }
        .json-string { color: #4ade80; }
        .json-number { color: #60a5fa; }
        .json-boolean { color: #fbbf24; }
        .json-null { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 EliteJioSaavn API Live Playground</h1>
            <p class="subtitle">Test endpoints with real data and see rendered results instantly</p>
        </header>
        
        <div class="endpoints-grid" id="endpointsGrid"></div>
        
        <div class="main-content">
            <!-- Left Panel: Request -->
            <div class="panel">
                <h2>📤 Request</h2>
                <div id="requestForm"></div>
            </div>
            
            <!-- Middle Panel: Response JSON -->
            <div class="panel">
                <h2>📋 JSON Response</h2>
                <div id="responsePanel" class="loading">Select endpoint and click Test</div>
            </div>
            
            <!-- Right Panel: Rendered Results -->
            <div class="panel">
                <h2>🎬 Rendered Results</h2>
                <div id="renderedPanel" class="loading">Results will show here</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://elitejiosaavn-api.vercel.app';
        
        const endpoints = [
            {
                id: 'search-songs',
                title: 'Search Songs',
                method: 'GET',
                url: '/api/songs?q=',
                description: 'Search for songs by name',
                params: [
                    { name: 'q', label: 'Search Query', type: 'text', placeholder: 'Shape of You', required: true }
                ]
            },
            {
                id: 'song-details',
                title: 'Song Details',
                method: 'GET',
                url: '/api/songs/',
                description: 'Get detailed info about a song',
                params: [
                    { name: 'id', label: 'Song ID', type: 'text', value: '702592', required: true }
                ]
            },
            {
                id: 'lyrics-sync',
                title: 'Synced Lyrics',
                method: 'GET',
                url: '/api/lyrics/',
                description: 'Get time-synced lyrics for a song',
                params: [
                    { name: 'id', label: 'Song ID', type: 'text', value: '702592', required: true }
                ],
                subPath: '/sync'
            },
            {
                id: 'search-albums',
                title: 'Search Albums',
                method: 'GET',
                url: '/api/albums?q=',
                description: 'Search for albums by name',
                params: [
                    { name: 'q', label: 'Search Query', type: 'text', placeholder: 'Thriller', required: true }
                ]
            },
            {
                id: 'album-details',
                title: 'Album Details',
                method: 'GET',
                url: '/api/albums/',
                description: 'Get album info with all songs',
                params: [
                    { name: 'id', label: 'Album ID', type: 'text', value: '81366122', required: true }
                ]
            },
            {
                id: 'search-artists',
                title: 'Search Artists',
                method: 'GET',
                url: '/api/artists?q=',
                description: 'Search for artists by name',
                params: [
                    { name: 'q', label: 'Search Query', type: 'text', placeholder: 'Arijit Singh', required: true }
                ]
            },
            {
                id: 'artist-details',
                title: 'Artist Details',
                method: 'GET',
                url: '/api/artists/',
                description: 'Get artist information and top songs',
                params: [
                    { name: 'id', label: 'Artist ID', type: 'text', value: '459320', required: true }
                ]
            },
            {
                id: 'playlist-details',
                title: 'Playlist Details',
                method: 'GET',
                url: '/api/playlists/',
                description: 'Get playlist with all songs',
                params: [
                    { name: 'id', label: 'Playlist ID', type: 'text', value: '1134543272', required: true }
                ]
            },
            {
                id: 'trending-artists',
                title: 'Trending Artists',
                method: 'GET',
                url: '/api/trending/artists?page=',
                description: 'Get popular trending artists',
                params: [
                    { name: 'page', label: 'Page', type: 'number', value: '1', required: true }
                ]
            },
            {
                id: 'charts',
                title: 'Charts',
                method: 'GET',
                url: '/api/charts?lang=',
                description: 'Get music charts by language',
                params: [
                    { name: 'lang', label: 'Language', type: 'select', value: 'en', options: ['en', 'hi', 'ta', 'te', 'ml', 'kn'], required: true }
                ]
            },
            {
                id: 'home-feed',
                title: 'Home Feed',
                method: 'GET',
                url: '/api/home?lang=',
                description: 'Get personalized home feed',
                params: [
                    { name: 'lang', label: 'Language', type: 'select', value: 'en', options: ['en', 'hi', 'ta', 'te', 'ml', 'kn'], required: true }
                ]
            },
            {
                id: 'news',
                title: 'Music News',
                method: 'GET',
                url: '/api/news?page=',
                description: 'Get latest music news and updates',
                params: [
                    { name: 'page', label: 'Page', type: 'number', value: '1', required: true }
                ]
            }
        ];
        
        let currentEndpoint = null;
        
        // Render endpoint cards
        const grid = document.getElementById('endpointsGrid');
        endpoints.forEach(ep => {
            const card = document.createElement('div');
            card.className = 'endpoint-card';
            card.innerHTML = `
                <div class="card-method">${ep.method}</div>
                <div class="card-title">${ep.title}</div>
                <div class="card-url">${ep.url}</div>
            `;
            card.onclick = () => selectEndpoint(ep, card);
            grid.appendChild(card);
        });
        
        function selectEndpoint(endpoint, cardElement) {
            document.querySelectorAll('.endpoint-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');
            currentEndpoint = endpoint;
            renderForm();
        }
        
        function renderForm() {
            const form = document.getElementById('requestForm');
            let html = '';
            
            if (!currentEndpoint) return;
            
            currentEndpoint.params.forEach(param => {
                if (param.type === 'select') {
                    html += `
                        <div class="form-group">
                            <label>${param.label}</label>
                            <select id="param-${param.name}" onchange="updateUrl()">
                                ${param.options.map(opt => `<option value="${opt}" ${opt === param.value ? 'selected' : ''}>${opt}</option>`).join('')}
                            </select>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="form-group">
                            <label>${param.label}</label>
                            <input type="${param.type}" id="param-${param.name}" value="${param.value || ''}" placeholder="${param.placeholder || ''}" onchange="updateUrl()" />
                        </div>
                    `;
                }
            });
            
            html += `
                <div class="url-display" id="urlDisplay">${API_BASE}${currentEndpoint.url}</div>
                <div class="button-group">
                    <button class="btn btn-primary" onclick="testEndpoint()">🚀 Test</button>
                    <button class="btn btn-secondary" onclick="copyUrl()">📋 Copy</button>
                </div>
            `;
            
            form.innerHTML = html;
            updateUrl();
        }
        
        function updateUrl() {
            if (!currentEndpoint) return;
            
            let url = API_BASE + currentEndpoint.url;
            
            currentEndpoint.params.forEach(param => {
                const input = document.getElementById(`param-${param.name}`);
                if (input) {
                    const value = input.value;
                    if (param === currentEndpoint.params[0]) {
                        url += encodeURIComponent(value);
                    } else {
                        url += `&${param.name}=${encodeURIComponent(value)}`;
                    }
                }
            });
            
            if (currentEndpoint.subPath) {
                url += currentEndpoint.subPath;
            }
            
            document.getElementById('urlDisplay').textContent = url;
        }
        
        async function testEndpoint() {
            if (!currentEndpoint) return;
            
            const responsePanel = document.getElementById('responsePanel');
            const renderedPanel = document.getElementById('renderedPanel');
            responsePanel.innerHTML = '<div class="loading">Loading...</div>';
            renderedPanel.innerHTML = '<div class="loading">Loading...</div>';
            
            let url = API_BASE + currentEndpoint.url;
            
            currentEndpoint.params.forEach(param => {
                const input = document.getElementById(`param-${param.name}`);
                if (input) {
                    const value = input.value;
                    if (param === currentEndpoint.params[0]) {
                        url += encodeURIComponent(value);
                    } else {
                        url += `&${param.name}=${encodeURIComponent(value)}`;
                    }
                }
            });
            
            if (currentEndpoint.subPath) {
                url += currentEndpoint.subPath;
            }
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (response.ok) {
                    // Display JSON
                    responsePanel.innerHTML = `<div class="json-viewer">${syntaxHighlightJSON(JSON.stringify(data, null, 2))}</div>`;
                    
                    // Display rendered results
                    displayResults(data);
                } else {
                    responsePanel.innerHTML = `<div class="error">Error: ${data.message || response.statusText}</div>`;
                    renderedPanel.innerHTML = `<div class="error">Error fetching data</div>`;
                }
            } catch (error) {
                responsePanel.innerHTML = `<div class="error">Error: ${error.message}</div>`;
                renderedPanel.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        function syntaxHighlightJSON(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                var cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }
        
        function displayResults(data) {
            const renderedPanel = document.getElementById('renderedPanel');
            let html = '';
            
            if (data.data) {
                if (Array.isArray(data.data)) {
                    html += '<div class="results-grid">';
                    data.data.slice(0, 8).forEach(item => {
                        html += renderItem(item);
                    });
                    html += '</div>';
                    if (data.data.length > 8) {
                        html += `<div style="color: #94a3b8; margin-top: 10px; font-size: 0.9em;">Showing 8 of ${data.data.length} results</div>`;
                    }
                } else {
                    html += '<div class="results-grid">';
                    html += renderItem(data.data);
                    html += '</div>';
                }
            } else if (data.lyrics) {
                html = `<div class="result-text"><strong>Lyrics:</strong><br>${data.lyrics.substring(0, 500)}...</div>`;
                if (data.copyright) {
                    html += `<div class="result-meta">${data.copyright}</div>`;
                }
            } else {
                html = `<div class="result-text">No displayable results. Check JSON panel.</div>`;
            }
            
            renderedPanel.innerHTML = html;
        }
        
        function renderItem(item) {
            let html = '<div class="result-item">';
            
            if (item.image) {
                html += `<img src="${item.image}" alt="Cover" class="result-image" onerror="this.style.display='none'" />`;
            }
            
            if (item.title) {
                html += `<div class="result-title">${item.title}</div>`;
            } else if (item.name) {
                html += `<div class="result-title">${item.name}</div>`;
            }
            
            if (item.description) {
                html += `<div class="result-text">${item.description.substring(0, 100)}</div>`;
            } else if (item.subtitle) {
                html += `<div class="result-text">${item.subtitle}</div>`;
            }
            
            if (item.artists) {
                html += `<div class="result-text"><strong>🎤</strong> ${item.artists}</div>`;
            }
            if (item.album) {
                html += `<div class="result-text"><strong>💿</strong> ${item.album}</div>`;
            }
            if (item.language) {
                html += `<div class="result-meta">🌐 ${item.language}</div>`;
            }
            if (item.duration) {
                html += `<div class="result-meta">⏱️ ${Math.floor(item.duration / 60)}:${(item.duration % 60).toString().padStart(2, '0')}</div>`;
            }
            
            html += '</div>';
            return html;
        }
        
        function copyUrl() {
            const url = document.getElementById('urlDisplay').textContent;
            navigator.clipboard.writeText(url).then(() => {
                alert('URL copied!');
            });
        }
    </script>
</body>
</html>
